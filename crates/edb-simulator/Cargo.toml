[package]
name = "edb-simulator"
version = "0.1.0"
edition = "2021"
authors = ["Web3 Toolkit Team"]
license = "AGPL-3.0"
description = "Local transaction simulation wrapper around the EDB engine."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
eyre = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
edb-engine = { workspace = true }
edb-common = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true, features = ["reqwest"] }
alloy-rpc-types = { workspace = true, features = ["eth"] }
alloy-eips = { workspace = true }
# Required for FE artifact preloading
foundry-compilers = { workspace = true }
foundry-block-explorers = { workspace = true }
semver = { workspace = true }
revm = { workspace = true, features = [
    "std",
    "serde",
    "alloydb",
    "optional_block_gas_limit",
    "optional_no_base_fee",
    "optional_balance_check",
    "optional_eip3607",
] }
